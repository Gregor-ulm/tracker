name: YouTube Radar Automation

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:   # Ermöglicht es dir, das Skript jederzeit manuell zu testen

jobs:
  run-radar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Erlaubt GitHub, die Messdaten im Repo abzuspeichern

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Abhängigkeiten installieren
        run: pip install google-api-python-client

      - name: Skript ausführen
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }} # Holt den versteckten Key
        run: python tracker.py

      - name: Ergebnisse im GitHub Repository speichern
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add status.json status.txt tracking_*.txt || true
          git commit -m "Automatische View-Messung aktualisiert [skip ci]" || echo "Keine Änderungen"
          git push
